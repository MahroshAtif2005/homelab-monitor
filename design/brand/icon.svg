<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.42" r="0.75">
      <stop offset="0" stop-color="#d29922" stop-opacity="0.10"/>
      <stop offset="0.6" stop-color="#d29922" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b73a"/>
      <stop offset="1" stop-color="#b97e12"/>
    </linearGradient>
    <!-- radar sweep wedge -->
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d29922" stop-opacity="0"/>
      <stop offset="1" stop-color="#d29922" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="blip" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset="0.4" stop-color="#f0b73a"/>
      <stop offset="1" stop-color="#f0b73a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- panel -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#vig)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#d29922" stroke-opacity="0.18" stroke-width="2"/>

  <g transform="translate(256,256)">
    <!-- radar sweep -->
    <path d="M0,0 L168,-78 A185,185 0 0,1 168,78 Z" fill="url(#sweep)" transform="rotate(-35)"/>

    <!-- concentric rings -->
    <circle r="178" fill="none" stroke="url(#ring)" stroke-width="6"/>
    <circle r="128" fill="none" stroke="#d29922" stroke-width="3" stroke-opacity="0.55"/>
    <circle r="78"  fill="none" stroke="#d29922" stroke-width="2.5" stroke-opacity="0.38"/>

    <!-- crosshairs -->
    <line x1="-178" y1="0" x2="178" y2="0" stroke="#d29922" stroke-width="2" stroke-opacity="0.22"/>
    <line x1="0" y1="-178" x2="0" y2="178" stroke="#d29922" stroke-width="2" stroke-opacity="0.22"/>

    <!-- tick marks -->
    <g stroke="#d29922" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-178" x2="0" y2="-160"/>
      <line x1="0" y1="178"  x2="0" y2="160"/>
      <line x1="-178" y1="0" x2="-160" y2="0"/>
      <line x1="178" y1="0"  x2="160" y2="0"/>
    </g>

    <!-- detected blips -->
    <circle cx="98" cy="-58" r="26" fill="url(#blip)"/>
    <circle cx="-72" cy="84" r="16" fill="url(#blip)" opacity="0.7"/>

    <!-- orbiting satellite on outer ring -->
    <g transform="rotate(-35) translate(178,0)">
      <circle r="13" fill="#0b0e14" stroke="url(#ring)" stroke-width="5"/>
    </g>

    <!-- center pulse + core -->
    <circle r="34" fill="url(#blip)" opacity="0.65"/>
    <circle r="13" fill="#ffe39a" filter="url(#glow)"/>
  </g>
</svg>
