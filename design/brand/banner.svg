<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/>
      <stop offset="1" stop-color="#0b0e14"/>
    </linearGradient>
    <radialGradient id="bvig" cx="0.26" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#d29922" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#d29922" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b73a"/>
      <stop offset="1" stop-color="#b97e12"/>
    </linearGradient>
    <linearGradient id="bsweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d29922" stop-opacity="0"/>
      <stop offset="1" stop-color="#d29922" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="bblip" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset="0.4" stop-color="#f0b73a"/>
      <stop offset="1" stop-color="#f0b73a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c9d1d9"/>
    </linearGradient>
    <filter id="bglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1500" height="500" fill="url(#bbg)"/>
  <rect width="1500" height="500" fill="url(#bvig)"/>

  <!-- radar mark -->
  <g transform="translate(250,250) scale(0.92)">
    <path d="M0,0 L168,-78 A185,185 0 0,1 168,78 Z" fill="url(#bsweep)" transform="rotate(-35)"/>
    <circle r="178" fill="none" stroke="url(#bring)" stroke-width="6"/>
    <circle r="128" fill="none" stroke="#d29922" stroke-width="3" stroke-opacity="0.55"/>
    <circle r="78"  fill="none" stroke="#d29922" stroke-width="2.5" stroke-opacity="0.38"/>
    <line x1="-178" y1="0" x2="178" y2="0" stroke="#d29922" stroke-width="2" stroke-opacity="0.22"/>
    <line x1="0" y1="-178" x2="0" y2="178" stroke="#d29922" stroke-width="2" stroke-opacity="0.22"/>
    <g stroke="#d29922" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-178" x2="0" y2="-160"/><line x1="0" y1="178" x2="0" y2="160"/>
      <line x1="-178" y1="0" x2="-160" y2="0"/><line x1="178" y1="0" x2="160" y2="0"/>
    </g>
    <circle cx="98" cy="-58" r="26" fill="url(#bblip)"/>
    <circle cx="-72" cy="84" r="16" fill="url(#bblip)" opacity="0.7"/>
    <g transform="rotate(-35) translate(178,0)"><circle r="13" fill="#0b0e14" stroke="url(#bring)" stroke-width="5"/></g>
    <circle r="34" fill="url(#bblip)" opacity="0.65"/>
    <circle r="13" fill="#ffe39a" filter="url(#bglow)"/>
  </g>

  <!-- wordmark -->
  <g font-family="'Segoe UI',Inter,Helvetica,Arial,sans-serif">
    <text x="500" y="232" fill="url(#word)" font-size="92" font-weight="800" letter-spacing="-1.5">HomeLab</text>
    <text x="500" y="330" fill="#d29922" font-size="92" font-weight="800" letter-spacing="-1.5">Monitor</text>
    <text x="506" y="392" fill="#8b949e" font-size="30" font-weight="500" letter-spacing="0.5">GPU truth · tokens/sec · power cost — one self-hosted page</text>
  </g>
</svg>
