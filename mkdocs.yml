site_name: HomeLab Monitor
site_description: A small, friendly dashboard for a self-hosted home lab — GPU, AI VRAM, Docker, systemd and host health. Multi-machine since 0.8.
site_url: https://sikamikanikobg.github.io/homelab-monitor/
site_author: SikamikanikoBG
repo_url: https://github.com/SikamikanikoBG/homelab-monitor
repo_name: SikamikanikoBG/homelab-monitor
edit_uri: edit/main/website/

docs_dir: website
site_dir: site

theme:
  name: material
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra_css:
  - assets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/SikamikanikoBG/homelab-monitor
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/sikamikaniko123/homelab-monitor

nav:
  - Home: index.md
  - Install: install.md
  - Multi-machine: multi-host.md
  - Configuration: configuration.md
  - Contributing: contributing.md

copyright: >
  Made by <a href="https://github.com/SikamikanikoBG">Arsen Apostolov</a> ·
  MIT licensed · Self-hosted &amp; open source
