<svg xmlns="http://www.w3.org/2000/svg" viewBox="64 64 384 384" role="img" aria-label="HomeLab Monitor">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0b73a"/>
      <stop offset="1" stop-color="#b97e12"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d29922" stop-opacity="0"/>
      <stop offset="1" stop-color="#d29922" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="blip" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe39a"/>
      <stop offset="0.4" stop-color="#f0b73a"/>
      <stop offset="1" stop-color="#f0b73a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g transform="translate(256,256)">
    <!-- radar sweep -->
    <path d="M0,0 L168,-78 A185,185 0 0,1 168,78 Z" fill="url(#sweep)" transform="rotate(-35)"/>
    <!-- concentric rings -->
    <circle r="178" fill="none" stroke="url(#ring)" stroke-width="7"/>
    <circle r="128" fill="none" stroke="#d29922" stroke-width="3.5" stroke-opacity="0.6"/>
    <circle r="78"  fill="none" stroke="#d29922" stroke-width="3" stroke-opacity="0.42"/>
    <!-- crosshairs -->
    <line x1="-178" y1="0" x2="178" y2="0" stroke="#d29922" stroke-width="2.5" stroke-opacity="0.25"/>
    <line x1="0" y1="-178" x2="0" y2="178" stroke="#d29922" stroke-width="2.5" stroke-opacity="0.25"/>
    <!-- tick marks -->
    <g stroke="#d29922" stroke-opacity="0.55" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-178" x2="0" y2="-158"/>
      <line x1="0" y1="178"  x2="0" y2="158"/>
      <line x1="-178" y1="0" x2="-158" y2="0"/>
      <line x1="178" y1="0"  x2="158" y2="0"/>
    </g>
    <!-- detected blips -->
    <circle cx="98" cy="-58" r="27" fill="url(#blip)"/>
    <circle cx="-72" cy="84" r="17" fill="url(#blip)" opacity="0.75"/>
    <!-- node on the outer ring (hollow so it works on any background) -->
    <g transform="rotate(-35) translate(178,0)">
      <circle r="13" fill="none" stroke="url(#ring)" stroke-width="6"/>
    </g>
    <!-- center pulse + core -->
    <circle r="34" fill="url(#blip)" opacity="0.7"/>
    <circle r="14" fill="#ffe39a" filter="url(#glow)"/>
  </g>
</svg>
