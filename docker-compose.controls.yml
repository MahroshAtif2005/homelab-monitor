# Opt-in container/service controls override — use alongside docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.controls.yml up -d
#
# This upgrades the docker socket AND the systemd D-Bus socket from :ro to
# read-write (needed to start/stop/restart containers and services, and to
# change a container's restart policy) and enables the Containers/Services
# tabs' action buttons. The main compose keeps both :ro so plain monitoring
# deployments are unaffected — combine with docker-compose.self-update.yml too
# if you want both opt-in write features.
services:
  homelab-monitor:
    environment:
      ENABLE_CONTROLS: "1"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
